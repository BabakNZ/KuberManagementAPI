version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: k8s_manager
      POSTGRES_USER: k8s_manager
      POSTGRES_PASSWORD: k8s_manager
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U k8s_manager" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-change-me}
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "*"
      DATABASE_URL: postgres://k8s_manager:k8s_manager@postgres:5432/k8s_manager
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY}
      K8S_VERIFY_SSL: "False"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
    ports:
      - "8000:8000"
    command: >
      sh -c "python manage.py migrate &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"

  redis:
    image: hub.hamdocker.ir/library/redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  worker:
    build: .
    depends_on:
      - backend
      - redis
    environment:
      DATABASE_URL: ${DATABASE_URL:-}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-}
      AWS_S3_REGION: ${AWS_S3_REGION:-}
      AWS_S3_KEY_PREFIX: ${AWS_S3_KEY_PREFIX:-}
      FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY}
    command: celery -A config worker -l info

volumes:
  postgres_data:

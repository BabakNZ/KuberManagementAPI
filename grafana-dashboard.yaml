apiVersion: v1
kind: ConfigMap
metadata:
  name: django-kubernetes-operations-dashboard
  namespace: monitoring-system
  labels:
    grafana_dashboard: "1"
data:
  django-kubernetes-operations.json: |
    {
      "title": "Django Kubernetes Operations",
      "uid": "django-kubernetes-operations",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "15s",
      "time": {"from": "now-30m", "to": "now"},
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Kubernetes operations by outcome",
          "gridPos": {"h": 9, "w": 24, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (resource, operation, outcome) (hamamooz_kubernetes_operations_total)",
              "legendFormat": "{{resource}} / {{operation}} / {{outcome}}"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "short"}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Successful operations",
          "gridPos": {"h": 6, "w": 8, "x": 0, "y": 9},
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "targets": [{"refId": "A", "expr": "sum(hamamooz_kubernetes_operations_total{outcome=\"success\"})"}],
          "fieldConfig": {"defaults": {"unit": "short", "color": {"mode": "thresholds"}}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "orientation": "auto", "textMode": "auto", "colorMode": "value"}
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Scrape target up",
          "gridPos": {"h": 6, "w": 8, "x": 8, "y": 9},
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "targets": [{"refId": "A", "expr": "up{job=\"django-backend\"}"}],
          "fieldConfig": {"defaults": {"unit": "short", "mappings": [{"type": "value", "options": {"0": {"text": "DOWN"}, "1": {"text": "UP"}}}]}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "orientation": "auto", "textMode": "auto", "colorMode": "value"}
        }
      ]
    }

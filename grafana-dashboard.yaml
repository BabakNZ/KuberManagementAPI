apiVersion: v1
kind: ConfigMap
metadata:
  name: django-kubernetes-operations-dashboard
  namespace: monitoring-system
  labels:
    grafana_dashboard: "1"
data:
  django-kubernetes-operations.json: |
    {
      "title": "Hamamooz Kubernetes Operations",
      "uid": "django-kubernetes-operations",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "15s",
      "time": {"from": "now-30m", "to": "now"},
      "panels": [
        {
          "id": 1,
          "type": "timeseries",
          "title": "Kubernetes operations",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0},
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (resource, operation, outcome) (rate(hamamooz_kubernetes_operations_total[5m]))",
              "legendFormat": "{{resource}} / {{operation}} / {{outcome}}"
            }
          ],
          "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}
        },
        {
          "id": 2,
          "type": "timeseries",
          "title": "Kubernetes operation duration (p95)",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0},
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "targets": [{"refId": "A", "expr": "histogram_quantile(0.95, sum by (le, resource, operation) (rate(hamamooz_kubernetes_operation_duration_seconds_bucket[5m])))", "legendFormat": "{{resource}} / {{operation}}"}],
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}
        },
        {
          "id": 3,
          "type": "timeseries",
          "title": "Backup jobs",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8},
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "targets": [{"refId": "A", "expr": "sum by (outcome) (rate(hamamooz_backup_jobs_total[5m]))", "legendFormat": "{{outcome}}"}],
          "fieldConfig": {"defaults": {"unit": "ops"}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}}
        },
        {
          "id": 4,
          "type": "timeseries",
          "title": "Backup duration (p95)",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8},
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "targets": [{"refId": "A", "expr": "histogram_quantile(0.95, sum by (le) (rate(hamamooz_backup_duration_seconds_bucket[5m])))", "legendFormat": "p95"}],
          "fieldConfig": {"defaults": {"unit": "s"}, "overrides": []},
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "single"}}
        },
        {
          "id": 5,
          "type": "stat",
          "title": "Backups in progress",
          "gridPos": {"h": 6, "w": 12, "x": 0, "y": 16},
          "datasource": {"type": "prometheus", "uid": "VictoriaMetrics"},
          "targets": [{"refId": "A", "expr": "hamamooz_backups_in_progress"}],
          "fieldConfig": {"defaults": {"unit": "short", "color": {"mode": "thresholds"}}, "overrides": []},
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "orientation": "auto", "textMode": "auto", "colorMode": "value"}
        }
      ]
    }

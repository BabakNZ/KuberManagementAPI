apiVersion: v1
kind: ConfigMap
metadata:
  name: k8s-manager-config
data:
  DJANGO_DEBUG: "False"
  DJANGO_ALLOWED_HOSTS: "k8s-manager.example.com"
  CORS_ALLOWED_ORIGINS: "https://k8s-manager.example.com"
  CSRF_TRUSTED_ORIGINS: "https://k8s-manager.example.com"
  K8S_VERIFY_SSL: "True"
  K8S_REQUEST_TIMEOUT_SECONDS: "10"
  SECURE_SSL_REDIRECT: "True"
  SECURE_HSTS_SECONDS: "31536000"
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/1
  BACKUP_REMOTE_REQUIRED: "True"
  AWS_S3_BUCKET: ""
  AWS_S3_REGION: ""
  AWS_S3_KEY_PREFIX: backups/
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: k8s_manager
            - name: POSTGRES_USER
              value: k8s_manager
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: k8s-manager-secrets
                  key: POSTGRES_PASSWORD
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U k8s_manager -d k8s_manager"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U k8s_manager -d k8s_manager"]
            initialDelaySeconds: 30
            periodSeconds: 10
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
spec:
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
    spec:
      initContainers:
        - name: migrate
          image: k8s-manager-backend:latest
          envFrom:
            - configMapRef:
                name: k8s-manager-config
          env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: k8s-manager-secrets
                  key: DJANGO_SECRET_KEY
            - name: FIELD_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: k8s-manager-secrets
                  key: FIELD_ENCRYPTION_KEY
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: k8s-manager-secrets
                  key: POSTGRES_PASSWORD
          command: ["sh", "-c"]
          args:
            - >-
              export DATABASE_URL="postgres://k8s_manager:${POSTGRES_PASSWORD}@postgres:5432/k8s_manager";
              python manage.py migrate --noinput
      containers:
        - name: backend
          image: k8s-manager-backend:latest
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: k8s-manager-config
          env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: k8s-manager-secrets
                  key: DJANGO_SECRET_KEY
            - name: FIELD_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: k8s-manager-secrets
                  key: FIELD_ENCRYPTION_KEY
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: k8s-manager-secrets
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: postgres://k8s_manager@postgres:5432/k8s_manager
          command: ["sh", "-c"]
          args:
            - >-
              export DATABASE_URL="postgres://k8s_manager:${POSTGRES_PASSWORD}@postgres:5432/k8s_manager";
              exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3
          readinessProbe:
            httpGet:
              path: /api/health/ready/
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health/
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  labels:
    app.kubernetes.io/name: worker
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: worker
    spec:
      containers:
        - name: worker
          image: k8s-manager-backend:latest
          envFrom:
            - configMapRef:
                name: k8s-manager-config
          env:
            - name: DJANGO_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: k8s-manager-secrets
                  key: DJANGO_SECRET_KEY
            - name: FIELD_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: k8s-manager-secrets
                  key: FIELD_ENCRYPTION_KEY
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: k8s-manager-secrets
                  key: POSTGRES_PASSWORD
          command: ["sh", "-c"]
          args:
            - >-
              export DATABASE_URL="postgres://k8s_manager:${POSTGRES_PASSWORD}@postgres:5432/k8s_manager";
              exec celery -A config worker --loglevel=INFO
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
spec:
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  labels:
    app.kubernetes.io/name: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
    spec:
      containers:
        - name: frontend
          image: k8s-manager-frontend:latest
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            periodSeconds: 10
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: k8s-manager
spec:
  rules:
    - host: k8s-manager.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  name: http
